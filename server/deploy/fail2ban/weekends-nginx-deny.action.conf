# /etc/fail2ban/action.d/weekends-nginx-deny.conf
# Bans at the nginx level for the WE Weekends vhost only: the banned address
# gets 403 from weekends-api.whiteeagles.sk while every other site on the
# host (whiteeagles.sk and the rest) keeps answering it as before. A firewall
# ban would block all sites, including crawlers of the main website.
[Definition]
actionstart = touch /etc/nginx/weekends-deny.conf
actionstop  = truncate -s 0 /etc/nginx/weekends-deny.conf && nginx -s reload
actioncheck =
actionban   = grep -qxF 'deny <ip>;' /etc/nginx/weekends-deny.conf || echo 'deny <ip>;' >> /etc/nginx/weekends-deny.conf; nginx -t -q && nginx -s reload
actionunban = sed -i '\#^deny <ip>;$#d' /etc/nginx/weekends-deny.conf; nginx -t -q && nginx -s reload
