# /etc/fail2ban/jail.d/weekends-api.conf
# Bans IPs that keep hitting the nginx rate limits of the WE Weekends vhost,
# and IPs that probe for paths that do not exist (scanners). The ban is an
# nginx deny inside this vhost only (action weekends-nginx-deny), never a
# firewall rule, so crawlers of the other sites on the host are unaffected.
[weekends-limit]
enabled  = true
backend  = auto
action   = weekends-nginx-deny
filter   = nginx-limit-req
logpath  = /var/log/nginx/weekends-api.error.log
maxretry = 20
findtime = 60
bantime  = 3600

[weekends-probe]
enabled  = true
backend  = auto
action   = weekends-nginx-deny
filter   = weekends-probe
logpath  = /var/log/nginx/weekends-api.access.log
maxretry = 15
findtime = 300
bantime  = 86400
