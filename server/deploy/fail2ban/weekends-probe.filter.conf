# /etc/fail2ban/filter.d/weekends-probe.conf
# Access log format wew_safe: '$remote_addr [$time_local] "$method $uri" $status ...'
# 404 on anything outside the API and 401/403 storms are scanner behaviour.
# fail2ban cuts the matched date out of the line; depending on the date
# template the brackets go with it or stay empty, so both are accepted.
[Definition]
failregex = ^<HOST>\s+(?:\[\])?\s*"\S+ [^"]*" (?:400|401|403|404|405|444) 
ignoreregex =
