# /etc/fail2ban/filter.d/weekends-probe.conf
# Access log format wew_safe: '$remote_addr [$time_local] "$method $uri" $status ...'
# 404 on anything outside the API and 401/403 storms are scanner behaviour.
[Definition]
failregex = ^<HOST> \[[^\]]+\] "\S+ [^"]*" (?:400|401|403|404|405|444) 
ignoreregex =
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
