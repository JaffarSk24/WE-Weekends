# nginx vhost of the WE Weekends gateway: weekends-api.whiteeagles.sk to the
# container on 127.0.0.1:8790. Install as
# /etc/nginx/sites-available/weekends-api.whiteeagles.sk and enable it.
# Only this vhost is affected; other sites on the host keep their own config.

# Per-IP limits. Zone names are unique to this app.
limit_req_zone  $binary_remote_addr zone=wew_api:10m  rate=5r/s;
limit_req_zone  $binary_remote_addr zone=wew_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=wew_conn:10m;

# No query strings and no headers in the log (tokens live in headers).
log_format wew_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

upstream we_weekends {
    server 127.0.0.1:8790;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name weekends-api.whiteeagles.sk;
    location ^~ /.well-known/acme-challenge/ { root /var/www/weekends-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weekends-api.whiteeagles.sk;

    ssl_certificate     /etc/letsencrypt/live/weekends-api.whiteeagles.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weekends-api.whiteeagles.sk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/weekends-api.access.log wew_safe;
    error_log  /var/log/nginx/weekends-api.error.log warn;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_conn wew_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Server;
    proxy_read_timeout 20s;
    proxy_connect_timeout 3s;

    # Login endpoints: much stricter per-IP rate.
    location ^~ /v1/auth/ {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=wew_auth burst=5 nodelay;
        proxy_pass http://we_weekends;
    }

    location ^~ /v1/ {
        limit_except GET POST PUT DELETE OPTIONS { deny all; }
        limit_req zone=wew_api burst=20 nodelay;
        proxy_pass http://we_weekends;
    }

    # Telegram webhook: only Telegram's published networks, POST only.
    location = /tg {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;
        limit_except POST { deny all; }
        access_log off;
        proxy_pass http://we_weekends;
    }

    location / { return 404; }
}
